<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GenZify</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>GenZify 💀</h1>

        <p class="subtitle">
            Turn your normal text into Gen-Z language.
        </p>

  <label for="style">Choose your vibe 🎭</label>

<select id="style">
    <option value="mild">Mild Gen Z</option>
    <option value="funny">Funny 😂</option>
    <option value="tiktok">TikTok 🔥</option>
    <option value="brainrot">Brainrot 💀</option>
    <option value="professional">Professional Gen Z</option>
</select>

<label for="inputText">Enter your text</label>

<textarea
    id="inputText"
    placeholder="Type something like: I am very tired today..."
></textarea>

        <button id="convertBtn">
            Gen Zify 🚀
        </button>

        <label for="outputText">Gen-Z version</label>

        <div id="outputText" class="output">
            Your converted text will appear here...
        </div>

        <button id="copyBtn" class="copy-btn">
            📋 Copy
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
